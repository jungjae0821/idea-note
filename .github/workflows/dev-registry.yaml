name: Dev Registry

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-registry-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Dev Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  publish:
    name: Push dev image to Registry
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    env:
      REGISTRY_HOST: ${{ vars.DEV_REGISTRY_HOST || 'docker.minq.live' }}
      # No team number is the instructor example; students set team1 through team8.
      REGISTRY_NAMESPACE: ${{ vars.DEV_REGISTRY_NAMESPACE || 'team' }}
      REGISTRY_USER: ${{ secrets.DEV_REGISTRY_USER }}
      REGISTRY_PASSWORD: ${{ secrets.DEV_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate destination
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REGISTRY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*(:[0-9]+)?$ ]]
          [[ "$REGISTRY_NAMESPACE" =~ ^team([1-8])?$ ]]
          test -n "$REGISTRY_USER"
          test -n "$REGISTRY_PASSWORD"
          echo "IMAGE_REPOSITORY=${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/idea-support-server" >> "$GITHUB_ENV"
          echo "CONTAINER_IMAGE=${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/idea-support-server:dev-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Log in to registry
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" --username "$REGISTRY_USER" --password-stdin
      - name: Build and push dev image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag "$CONTAINER_IMAGE" --tag "$IMAGE_REPOSITORY:latest" .
          docker push "$CONTAINER_IMAGE"
          docker push "$IMAGE_REPOSITORY:latest"
      - name: Show image location
        shell: bash
        run: |
          printf '### Dev image\n\nLatest: `%s/%s/idea-support-server:latest`\n\nCommit: `%s`\n' "$REGISTRY_HOST" "$REGISTRY_NAMESPACE" "$CONTAINER_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy team app and check health
        env:
          DEPLOY_URL: ${{ vars.DEV_DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEV_DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_URL" == "https://daelim.minq.live/_cd/$REGISTRY_NAMESPACE" ]]
          test -n "$DEPLOY_TOKEN"
          jq -n --arg image "$CONTAINER_IMAGE" --arg revision "$GITHUB_SHA" '{image:$image,revision:$revision}' > request.json
          curl --silent --show-error --fail-with-body --max-time 1800 \
            --header "Authorization: Bearer $DEPLOY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @request.json "$DEPLOY_URL" > deployment-result.json
          jq -e '.status == "deployed" or .status == "unchanged"' deployment-result.json
          prefix="$REGISTRY_NAMESPACE"
          if [[ "$prefix" == team ]]; then prefix=example; fi
          curl --silent --show-error --fail --retry 10 --retry-delay 6 --retry-all-errors "https://daelim.minq.live/$prefix/common/health" | jq -e '.status == "ok" and .database == "up"'
          printf '\n### Lightsail deployment\n\nHealth: https://daelim.minq.live/%s/common/health\n\n' "$prefix" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"Result: " + .status + "\n\nDigest: `" + .image + "`"' deployment-result.json >> "$GITHUB_STEP_SUMMARY"