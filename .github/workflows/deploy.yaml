name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'deploy/classroom-eks/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'deploy/classroom-eks/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: main-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  ECR_REGISTRY: 950177940921.dkr.ecr.ap-southeast-2.amazonaws.com
  ECR_REPOSITORY: idea-support-server8

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
            | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Build and Push Image
        env:
          CONTAINER_IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
        run: |
          docker build -t $CONTAINER_IMAGE .
          docker push $CONTAINER_IMAGE

      - name: Record deployed image digest in Git
        shell: bash
        run: |
          set -euo pipefail
          digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag=latest --region "$AWS_REGION" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          export DEPLOY_DIGEST="$digest"
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path('deploy/classroom-eks/apps/team8/kustomization.yaml')
          text = path.read_text()
          updated, count = re.subn(r'digest: sha256:[a-f0-9]{64}', 'digest: ' + os.environ['DEPLOY_DIGEST'], text)
          if count != 1:
              raise SystemExit('Expected one team8 image digest')
          path.write_text(updated)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/classroom-eks/apps/team8/kustomization.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deploy team8 image ${GITHUB_SHA}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
